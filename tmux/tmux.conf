set -g mouse on

# Set prefix to Ctrl-a (easier to type than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window numbering at 1 (easier to switch with keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Allow automatic window renaming
setw -g automatic-rename on
#set -g allow-rename off

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-less pane switching with Alt+Arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Prefix-less window switching with Shift+Arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+H/L for window switching (vim-style)
bind -n M-H previous-window
bind -n M-L next-window

# Improve colors
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:usstyle'
set -as terminal-features ',*256col*:RGB'

# Clipboard (OSC 52) and passthrough, also over SSH
set -g set-clipboard on
set -g allow-passthrough on

# Set status bar position to top
set -g status-position top

# Set status bar to 2 lines
#set -g 'status-format[1]' ''
#set -g status 2

# Refresh status bar every 5 seconds
set -g status-interval 5

# Enable activity alerts
setw -g monitor-activity on
set -g visual-activity off

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart pane splitting - preserve current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Clear screen with prefix + Ctrl-l (vim-tmux-navigator owns Ctrl-l)
bind C-l send-keys 'C-l'

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # Auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless vim/tmux navigation
set -g @plugin 'tmux-plugins/tmux-yank'  # Enhanced clipboard integration
set -g @plugin 'catppuccin/tmux'

# Catppuccin Theme Configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# Configure host status module
set -g @catppuccin_host_text " #(hostname -s)"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_host}"

# Auto-save sessions every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Tmux Resurrect configuration
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# SECURITY: Shell history saving disabled to prevent persisting sensitive data
# (passwords, API keys, tokens) that may be accidentally typed in commands
# set -g @resurrect-save-shell-history 'on'

# Add key bindings for manual save/restore
set -g @resurrect-save 'S'    # Save with prefix + S
set -g @resurrect-restore 'R' # Restore with prefix + R

# Bootstrap TPM on a fresh machine
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
