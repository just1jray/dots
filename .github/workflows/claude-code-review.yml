# Official Claude Code pull request review.
# https://code.claude.com/docs/en/github-actions
#
# Required secret: ANTHROPIC_API_KEY (repository Actions secret). The review
# job does not run when that secret is unset. No token is stored in the repo.
# GitHub does not allow the secrets context in a job or step `if`, so a
# separate step records only whether the secret is non-empty.
#
# This repository is public. GitHub does not pass Actions secrets to
# pull_request runs from forks, so those pull requests are skipped.
#
# Always leave a visible PR comment: write permissions + track_progress, the
# skill's gh/MCP tools in claude_args, and instructions that override the
# plugin's "skip trivial / already commented" early exits.

name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  secret:
    name: ANTHROPIC_API_KEY
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check ANTHROPIC_API_KEY
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "ANTHROPIC_API_KEY is not set; Claude Code review did not run."
          fi

  review:
    needs: secret
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.secret.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          track_progress: true
          use_sticky_comment: true
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Repository overrides for this workflow:
            - Never skip because the change looks trivial or automated. Always finish the review.
            - Never skip because Claude already commented on this PR. Always post (or update) a summary for this run.
            - Always leave a PR comment: either inline findings plus a short summary, or the standard "No issues found" summary when clean.
            - Draft and closed PRs may still be skipped.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
